<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pêndulo Simples — Bancada</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f1ea; color: #1d1f1c; }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
    a { color: #c2512b; }
    h1 { font-family: Georgia, serif; font-weight: 500; }
    canvas { width: 100%; background: #fbfaf6; border: 1px solid #d9d4c7; border-radius: 10px; }
    .controles { display: grid; gap: 12px; margin-top: 16px; }
    label { display: grid; gap: 4px; font-size: 14px; }
    .periodo { font-family: ui-monospace, monospace; margin-top: 12px; }
  </style>
</head>
<body>
  <main>
    <a href="../../">← Voltar para a Bancada</a>
    <h1>Pêndulo Simples</h1>
    <p>Altere o comprimento e a gravidade e observe o que acontece com o período.</p>
    <canvas id="tela" width="700" height="360"></canvas>
    <div class="controles">
      <label>Comprimento: <span id="vL"></span> m
        <input id="L" type="range" min="0.2" max="2" step="0.05" value="1"></label>
      <label>Gravidade: <span id="vG"></span> m/s²
        <input id="G" type="range" min="1" max="25" step="0.1" value="9.8"></label>
    </div>
    <p class="periodo">Período teórico T = 2π√(L/g) = <strong id="T"></strong> s</p>
  </main>
  <script>
    const tela = document.getElementById("tela"), ctx = tela.getContext("2d");
    const L = document.getElementById("L"), G = document.getElementById("G");
    let theta = 0.5, omega = 0, ultimo = performance.now();

    function atualizarTextos() {
      document.getElementById("vL").textContent = (+L.value).toFixed(2);
      document.getElementById("vG").textContent = (+G.value).toFixed(1);
      document.getElementById("T").textContent = (2 * Math.PI * Math.sqrt(L.value / G.value)).toFixed(2);
    }
    L.oninput = G.oninput = atualizarTextos;
    atualizarTextos();

    function quadro(agora) {
      const dt = Math.min((agora - ultimo) / 1000, 0.03); ultimo = agora;
      omega += (-G.value / L.value) * Math.sin(theta) * dt;
      theta += omega * dt;

      const ox = tela.width / 2, oy = 20, escala = 150;
      const x = ox + Math.sin(theta) * L.value * escala, y = oy + Math.cos(theta) * L.value * escala;
      ctx.clearRect(0, 0, tela.width, tela.height);
      ctx.strokeStyle = "#1d1f1c"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(ox - 40, oy); ctx.lineTo(ox + 40, oy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(x, y); ctx.stroke();
      ctx.fillStyle = "#c2512b"; ctx.beginPath(); ctx.arc(x, y, 16, 0, Math.PI * 2); ctx.fill();
      requestAnimationFrame(quadro);
    }
    requestAnimationFrame(quadro);
  </script>
</body>
</html>
